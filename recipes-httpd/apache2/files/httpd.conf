# Apache2 Main Configuration File for Yocto (Scarthgap)

ServerRoot "/usr/lib/apache2"

# Listen on HTTP and HTTPS
Listen 80
Listen 443

# Load necessary modules
LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so

# Enable mod_rewrite and mod_ssl
<IfModule mod_rewrite.c>
    RewriteEngine On
</IfModule>

<IfModule mod_ssl.c>
    SSLRandomSeed startup file:/dev/urandom 512
    SSLRandomSeed connect file:/dev/urandom 512
</IfModule>

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName yourdomain.com
    Redirect permanent / https://growbot.com/
</VirtualHost>

# HTTPS VirtualHost Configuration
<VirtualHost *:443>
    ServerName growbot.com
    DocumentRoot /var/www/html

    # Enable SSL
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/server.crt
    SSLCertificateKeyFile /etc/ssl/private/server.key

    # Enable Rewrite Engine for additional flexibility
    <Directory "/var/www/html">
        AllowOverride All
        Require all granted
    </Directory>

    # Custom Log Files (Optional)
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>

# Include other configuration files (like sites-available, etc.)
IncludeOptional ${sysconfdir}/apache2/sites-enabled/*.conf