# Apache2 Main Configuration File for Yocto (Scarthgap)

ServerRoot "/etc/apache2"
ServerName growbot.jsd

User www-data
Group www-data

# Listen on HTTP and HTTPS
Listen 80
Listen 443

# Load necessary modules
LoadModule mpm_prefork_module /usr/libexec/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module /usr/libexec/apache2/modules/mod_authz_core.so
LoadModule rewrite_module /usr/libexec/apache2/modules/mod_rewrite.so
LoadModule ssl_module /usr/libexec/apache2/modules/mod_ssl.so
LoadModule alias_module /usr/libexec/apache2/modules/mod_alias.so
LoadModule log_config_module /usr/libexec/apache2/modules/mod_log_config.so
LoadModule unixd_module /usr/libexec/apache2/modules/mod_unixd.so
LoadModule headers_module /usr/libexec/apache2/modules/mod_headers.so
LoadModule socache_shmcb_module /usr/libexec/apache2/modules/mod_socache_shmcb.so
LoadModule dir_module /usr/libexec/apache2/modules/mod_dir.so
LoadModule mime_module /usr/libexec/apache2/modules/mod_mime.so
LoadModule proxy_module /usr/libexec/apache2/modules//mod_proxy.so
LoadModule proxy_http_module /usr/libexec/apache2/modules//mod_proxy_http.so

# Enable debugging logs for troubleshooting
LogLevel debug
ErrorLog /var/log/apache2/error.log
CustomLog /var/log/apache2/access.log combined

## Enable mod_rewrite and mod_ssl
<IfModule mod_rewrite.c>
    RewriteEngine On
</IfModule>

<IfModule mod_ssl.c>
    SSLRandomSeed startup file:/dev/urandom 512
    SSLRandomSeed connect file:/dev/urandom 512
</IfModule>

# Configure SSL Session Cache
SSLSessionCache shmcb:/var/run/apache2/ssl_scache(512000)
SSLSessionCacheTimeout 300

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName growbot.jsd

    # Don't redirect MJPG stream requests
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/stream
    RewriteCond %{HTTP_HOST} ^(.*)$
    RewriteRule ^(.*)$ https://%1 [R=301,L]

    ErrorLog /var/log/apache2/http_redirect_error.log
    CustomLog /var/log/apache2/http_redirect_access.log combined
</VirtualHost>

# HTTPS VirtualHost Configuration
<VirtualHost *:443>
    ServerName growbot.jsd
    DocumentRoot /var/www/html

        <IfModule mod_headers.c>
            Header set Access-Control-Allow-Origin "*"
            Header set Access-Control-Allow-Methods "GET, OPTIONS"
            Header set Access-Control-Allow-Headers "Range"
        </IfModule>

    AddType video/mp4 .mp4
    AddType video/webm .webm
    AddType text/csv .csv

    # Set up reverse proxy for MJPG stream
    ProxyPass "/stream" "http://192.168.10.20:8080/"
    ProxyPassReverse "/stream" "http://192.168.10.20:8080/"

    # Proxy for Flask
    ProxyPreserveHost On
    ProxyPass /water http://localhost/water
    ProxyPassReverse /water http://localhost/water

    # Enable SSL
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/growbot.jsd.crt
    SSLCertificateKeyFile /etc/ssl/private/growbot.jsd.key

    # Custom Log Files (Optional)
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>

