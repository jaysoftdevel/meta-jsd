<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrowBot Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-color: #1e1e2f;
      --card-bg: #2c2c3e;
      --text-color: #f1f1f1;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-dark: #111827;
      --header-gradient: linear-gradient(45deg, #6a5acd, #3b82f6, #10b981);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 1rem;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
      max-width: 100vw;
    }

    header {
      text-align: center;
      font-size: 2.5rem;
      font-weight: bold;
      background: var(--header-gradient);
      background-size: 200%;
      color: transparent;
      padding: 1rem 0.5rem;
      background-clip: text;
      -webkit-background-clip: text;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      0% {
        background-position: -200%;
      }

      100% {
        background-position: 200%;
      }
    }

    .main-content {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
      max-width: 100%;
      box-sizing: border-box;
    }

    .webcam-frame,
    .chart-container {
      flex: 1 1 45%;
      background-color: var(--card-bg);
      padding: 0.75rem;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      max-width: 100%;
      box-sizing: border-box;
    }

    .webcam-frame img {
      height: auto;
      max-width: 100%;
      border-radius: 10px;
      display: block;
    }

    .chart-container canvas {
      width: 100% !important;
      height: auto !important;
      max-height: 400px;
      display: block;
    }

    #chart-info {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #ccc;
      text-align: center;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      padding-top: 0.5rem;
      max-width: 100%;
    }

    .chart-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 100%;
    }

    .chart-buttons button {
      padding: 6px 10px;
      font-size: 0.85rem;
      border: none;
      background-color: var(--accent-blue);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .chart-buttons button:hover {
      background-color: #2563eb;
      box-shadow: 0 0 10px var(--accent-blue);
    }

    .chart-buttons button.active {
      background-color: var(--accent-green);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
      transform: scale(1.1);
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      100% {
        transform: scale(1.1);
      }
    }

    .watering-section {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem 0.5rem;
      flex-direction: column;
      text-align: center;
      max-width: 100%;
    }

    .watering-wrapper {
      display: inline-block;
      text-align: left;
      width: 100%;
      max-width: 380px;
    }

    .watering-wrapper label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .watering-frame {
      transition: opacity 0.3s ease;
      border: 2px solid #333;
      padding: 10px;
      border-radius: 10px;
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      width: 100%;
      max-width: 100%;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    .watering-frame button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .watering-frame button:hover {
      background-color: #45a099;
    }

    .watering-frame button:disabled {
      background-color: #661616;
    }

    .watering-frame input[type="range"] {
      width: 100%;
    }

    .watering-frame span {
      font-size: 15px;
      font-weight: bold;
    }

    .watering-frame label {
      font-size: 13px;
    }

    .watering-frame input[type="radio"] {
      margin-right: 5px;
    }

    .log-container {
      flex: 1 1 45%;
      background-color: var(--card-bg);
      padding: 0.75rem;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      max-width: 80%;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      header {
        font-size: 2rem;
        padding: 1rem;
      }

      .main-content {
        padding: 0.5rem;
        align-items: center;
      }

      .webcam-frame,
      .chart-container {
        max-width: 100%;
        width: 100%;
        flex: none;
      }

      .chart-buttons {
        gap: 6px;
      }

      .chart-buttons button {
        flex: 1 1 auto;
        min-width: 80px;
      }

      .watering-frame {
        width: 100%;
        max-width: 100%;
      }

      .watering-section {
        padding: 0.5rem;
      }
    }
    .growbot-log {
      width: 100%;
      min-height: 200px;
      background-color: #1f2937; /* slightly lighter dark */
      color: #f9fafb; /* light text for contrast */
      border: 1px solid #374151; /* subtle border */
      border-radius: 0.5rem;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.9rem;
      resize: vertical;
      box-sizing: border-box;
      line-height: 1.4;
      outline: none;
    }
  
    .growbot-log:focus {
      border-color: #3b82f6; /* blue border on focus */
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
    }
  </style>

</head>

<body>

  <header>JSD's GrowBot</header>

  <!-- Webcam and Chart -->
  <div class="main-content">
    <div class="webcam-frame">
      <img src="/stream?action=stream" alt="Webcam Feed">
    </div>

    <div class="chart-container">
      <canvas id="myChart"></canvas>
      <div id="chart-info"></div>
      <div class="button-container">
        <div class="chart-buttons">
          <button onclick="setDataLimit(360)">1 hour</button>
          <button onclick="setDataLimit(8640)">1 day</button>
          <button onclick="setDataLimit(60480)">1 week</button>
          <button onclick="setDataLimit('all')">All</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Watering Control -->
  <div class="watering-section">
    <div class="watering-wrapper">
      <label><input type="checkbox" id="override-checkbox"> Override</label>

      <div class="watering-frame" id="watering-frame">
        <button id="water-button" onclick="triggerWater()">Water</button>

        <label for="water-level">Water Level (1-10)</label>
        <input type="range" id="water-level" min="1" max="10" value="5" oninput="updateWaterLevel(this.value)">
        <span id="water-level-value">5</span>

        <div>
          <label><input type="radio" name="pump" value="pump0" checked> Pump 0</label>
          <label><input type="radio" name="pump" value="pump1"> Pump 1</label>
        </div>
      </div>
    </div>
  </div>

  <div class="log-section" style="display: flex; justify-content: center; padding: 2rem;">
    <div class="log-container">
      <h2 style="margin-top: 0; font-size: 1.25rem; color: #f1f1f1; margin-bottom: 1rem;">
        Pump Log
      </h2>
  
      <div style="
        background-color: #141414; /* Dark background for terminal effect */
        color: #e5e7eb; /* Light text */
        font-family: 'Courier New', monospace;
        font-size: 0.85rem;
        border-radius: 8px;
        padding: 1rem;
        max-height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
      " id="pump-log"></div>
  
      <div style="text-align: right; margin-top: 1rem;">
        <button onclick="reloadLogs()" style="
          background-color: #4b5563; /* Button background */
          color: white;
          border: none;
          padding: 0.5rem 1rem;
          border-radius: 6px;
          cursor: pointer;
          font-size: 0.9rem;
        ">
          Reload Logs
        </button>
      </div>
    </div>
  </div>
  

  <script>
    let myChartInstance = null;
    let fullData = { times: [], data0: [], data1: [] };
    let currentLimit = 60;

    function reloadLogs() {
      fetch('growbot-logs.log')
        .then(response => {
          if (!response.ok) throw new Error("Failed to load log");
          return response.text();
        })
        .then(logText => {
          const pre = document.getElementById('pump-log');
          pre.textContent = logText;
          pre.scrollTop = pre.scrollHeight;
        })
        .catch(err => {
          console.error("Error loading logs:", err);
          document.getElementById('pump-log').textContent = "Error loading log file.";
        });
    }

    // Function to scroll the iframe content to the bottom
    function scrollToBottom(iframeId) {
      const iframe = document.getElementById(iframeId);
      try {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        iframeDoc.documentElement.scrollTop = iframeDoc.body.scrollHeight;
      } catch (e) {
        console.error('Unable to access iframe content:', e);
      }
    }

    // Initial load of logs
    reloadLogs();

    // Wait until the DOM is fully loaded before accessing elements
    document.addEventListener('DOMContentLoaded', function () {
      const waterButton = document.getElementById('water-button');
      const overrideCheckbox = document.getElementById('override-checkbox');
      const wateringFrame = document.getElementById('watering-frame');

      // Ensure that the elements exist
      if (!waterButton || !overrideCheckbox || !wateringFrame) {
        console.error("Error: One or more required elements are missing in the DOM.");
        return;
      }

      // Function to enable or disable the Water button based on the checkbox status
      function toggleWaterButton() {
        console.log('Override Checkbox Checked:', overrideCheckbox.checked);

        // If the checkbox is checked, enable the Water button; otherwise, disable it
        waterButton.disabled = !overrideCheckbox.checked;

        // If the checkbox is unchecked, disable the whole watering frame and gray it out
        if (overrideCheckbox.checked) {
          wateringFrame.style.pointerEvents = 'auto';  // Enable interactions
          wateringFrame.style.opacity = '1';  // Restore opacity
        } else {
          wateringFrame.style.pointerEvents = 'none';  // Disable interactions
          wateringFrame.style.opacity = '0.5';  // Apply gray out effect
        }
      }

      // Attach the toggle function to the checkbox event listener
      overrideCheckbox.addEventListener('click', toggleWaterButton);

      // Initialize button state on page load based on checkbox status
      toggleWaterButton(); // To handle initial state based on checkbox status
    });

    // Trigger the watering request after confirmation
    function triggerWater() {
      const waterLevel = document.getElementById('water-level').value; // Get the current slider value
      const pumpSelection = document.querySelector('input[name="pump"]:checked').value; // Get selected pump (pump0 or pump1)

      // Show a confirmation dialog before sending the request
      const userConfirmed = confirm(`Are you sure you want to water with Pump ${pumpSelection} at level ${waterLevel}?`);

      if (userConfirmed) {
        // Send the water level and pump selection to the Flask backend if confirmed
        console.log("stinging: ", JSON.stringify({
          water_duration: waterLevel,
          pump_selection: pumpSelection // Send pump selection as part of the request
        }))
        fetch('/water', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            water_duration: waterLevel,
            pump_selection: pumpSelection
          })
        })
          .then(async response => {
            const contentType = response.headers.get("content-type");
            if (!response.ok) {
              const errorText = await response.text();
              console.error("Server returned error:", errorText);
              throw new Error("Server error");
            }
            if (contentType && contentType.includes("application/json")) {
              return response.json();
            } else {
              throw new TypeError("Expected JSON, got: " + contentType);
            }
          })
          .then(data => {
            console.log('Water triggered: ', data);
          })
          .catch(error => {
            console.error('Water trigger error: ', error);
            alert("Failed to trigger watering.");
          });
      } else {
        console.log("Watering cancelled by user.");
      }
    }

    // Update the value of the slider as it's moved
    function updateWaterLevel(value) {
      document.getElementById('water-level-value').textContent = value;
    }


    // For setting data limit (chart buttons)
    function setDataLimit(limit) {
      // Your code for handling data limit
      console.log(`Data limit set to: ${limit}`);
    }

    async function fetchCSV() {
      try {
        const response = await fetch('moist_log.csv');
        const data = await response.text();
        const rows = data.split("\n").slice(1); // Skip header

        fullData.times = [];
        fullData.data0 = [];
        fullData.data1 = [];

        rows.forEach(row => {
          const [time, val0, val1] = row.split(",");
          if (time && val0 && val1) {
            fullData.times.push(time.trim());
            fullData.data0.push(parseInt(val0.trim(), 10));
            fullData.data1.push(parseInt(val1.trim(), 10));
          }
        });

        renderChartWithLimit();
      } catch (error) {
        console.error("Error fetching CSV:", error);
      }
    }

    function setDataLimit(limit) {
      currentLimit = limit;
      renderChartWithLimit();

      const buttons = document.querySelectorAll('.button-container button');
      buttons.forEach(btn => btn.classList.remove('active'));

      const limitMap = {
        60: "10 min",
        360: "1 hour",
        8640: "1 day",
        60480: "1 week",
        all: "All"
      };

      buttons.forEach(btn => {
        if (btn.textContent.trim() === limitMap[limit]) {
          btn.classList.add('active');
        }
      });
    }

    function renderChartWithLimit() {
      let { times, data0, data1 } = fullData;

      if (!times.length) return;

      let startTime = times[0];
      let endTime = times[times.length - 1];
      let entryCount = times.length;

      if (currentLimit !== 'all') {
        times = times.slice(-currentLimit);
        data0 = data0.slice(-currentLimit);
        data1 = data1.slice(-currentLimit);
      }

      updateChart(times, data0, data1);

      // Calculate duration (based on full CSV data, not filtered)
      const start = parseTimeToDate(fullData.times[0]);
      const end = parseTimeToDate(fullData.times[fullData.times.length - 1]);
      const diffMs = end - start;

      let duration = "N/A";
      if (!isNaN(diffMs)) {
        const totalMinutes = Math.floor(diffMs / (1000 * 60));
        const days = Math.floor(totalMinutes / (60 * 24));
        const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
        const minutes = totalMinutes % 60;

        duration = [
          days ? `${days}d` : "",
          hours ? `${hours}h` : "",
          `${minutes}m`
        ].filter(Boolean).join(" ");
      }

      const infoBox = document.getElementById('chart-info');
      infoBox.innerHTML = `
        📅 <strong>Start:</strong> ${startTime} &nbsp; |
        🧮 <strong>Entries:</strong> ${entryCount} &nbsp; |
        ⏱️ <strong>Duration:</strong> ${duration}
      `;
    }

    function parseTimeToDate(timeStr) {
      const [hours, minutes, seconds] = timeStr.split(":").map(num => parseInt(num, 10));
      const now = new Date();
      now.setHours(hours, minutes, seconds, 0); // Set to today's date with the given time
      return now;
    }

    function updateChart(times, data0, data1) {
      if (myChartInstance) {
        myChartInstance.data.labels = times.reverse(); // Reverse the times to show latest on the right
        myChartInstance.data.datasets[0].data = data0.reverse(); // Reverse the data to show latest on the right
        myChartInstance.data.datasets[1].data = data1.reverse(); // Reverse the data to show latest on the right
        myChartInstance.update();
      } else {
        const ctx = document.getElementById('myChart').getContext('2d');
        myChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: times.reverse(), // Reverse the times to show latest on the right
            datasets: [
              {
                label: 'Sensor 1',
                data: data0.reverse(), // Reverse the data to show latest on the right
                borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accent-blue').trim(),
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                borderWidth: 2,
                fill: false,
                tension: 0.3
              },
              {
                label: 'Sensor 2',
                data: data1.reverse(), // Reverse the data to show latest on the right
                borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accent-green').trim(),
                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                borderWidth: 2,
                fill: false,
                tension: 0.3
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              title: {
                display: true,
                text: 'Soil moisture',
                font: {
                  size: 18,
                  weight: 'bold'
                },
                color: '#f1f1f1'
              }
            },
            scales: {
              x: {
                reverse: true, // This makes the chart render from right to left
                ticks: {
                  color: '#ccc',
                  callback: function (value, index) {
                    // Show only every 10th tick on the x-axis
                    return index % 10 === 0 ? this.getLabelForValue(value) : '';
                  }
                },
                title: {
                  display: true,
                  text: 'Time',
                  color: '#eee'
                }
              },
              y: {
                beginAtZero: false,
                min: 0,  // Set the minimum value of the y-axis to 150
                max: 600,  // Set the maximum value of the y-axis to 550
                ticks: { color: '#ccc' },
                title: {
                  display: true,
                  text: 'Moisture',
                  color: '#eee'
                }
              }
            },
            animation: {
              duration: 2000, // Animation duration
              easing: 'easeOutQuart', // Smooth easing for the drawing animation
              onComplete: function () {
                console.log("Animation complete");
              }
            }
          }
        });
      }
    }

    fetchCSV();
    setDataLimit(60); // default to 60 read cycles
    setInterval(fetchCSV, 10000);
    // Auto-load logs on page load
    document.addEventListener('DOMContentLoaded', reloadLogs);
  </script>
</body>

</html>
