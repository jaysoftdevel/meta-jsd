<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chart.js on Apache</title>
        <!-- Load Chart.js first -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            /* Center and fix the graph size */
            .chart-container {
                width: 500px;  /* Fixed width */
                height: 300px; /* Fixed height */
                position: relative; /* Absolute positioning */
                border: 2px solid black; /* Optional: Adds a border */
                background-color: white; /* Ensures visibility */
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* Fix the canvas size */
            canvas {
                width: 50% !important;
                height: 50%;
            }
        </style>
    </head>
<body>
    <h2>Webcam Stream and Line Chart</h2>

    <!-- Webcam Stream Section -->
    <h3>Webcam Stream:</h3>
    <img src="https://192.168.10.20/stream?action=stream" alt="Webcam Feed">

    <h2>Line Chart from CSV with Time and Uint8 Data</h2>
    <canvas id="myChart"></canvas>

    <script>
        async function fetchCSV() {
            // Fetch the CSV file
            const response = await fetch('data.csv'); // Replace with your CSV file path
            const data = await response.text();
            const rows = data.split("\n").slice(1); // Skip the header row

            let times = [], values = [];

            // Parse each row of the CSV
            rows.forEach(row => {
                const [time, uint8, label] = row.split(",");

                if (time && uint8) {
                    times.push(time); // Time as x-axis
                    values.push(parseInt(uint8, 10)); // uint8 as y-axis data
                }
            });

            // Create the chart with parsed data
            createChart(times, values);
        }

        // Function to create the chart
        function createChart(times, values) {
            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: times, // Use times as the x-axis labels
                    datasets: [{
                        label: 'Uint8 Data',
                        data: values,
                        borderColor: 'blue',
                        borderWidth: 2,
                        fill: false
                    }]
                },
                options: {
                    scales: {
                        x: {
                            type: 'category',
                            labels: times
                        },
                        y: {
                            min: 0,
                            max: 255 // uint8 max value
                        }
                    }
                }
            });
        }

        // Call the function to fetch and display the data
        fetchCSV();
    </script>

</body>
</html>
