<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrowBot Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-color: #1e1e2f;
      --card-bg: #2c2c3e;
      --text-color: #f1f1f1;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-dark: #111827;
      --header-gradient: linear-gradient(45deg, #6a5acd, #3b82f6, #10b981);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 1rem;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;

      max-width: 100vw;
    }

    body.modal-open {
      overflow: hidden;
    }

    header {
      text-align: center;
      font-size: 2.5rem;
      font-weight: bold;
      background: var(--header-gradient);
      background-size: 200%;
      color: transparent;
      padding: 1rem 0.5rem;
      background-clip: text;
      -webkit-background-clip: text;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      0% {
        background-position: -200%;
      }

      100% {
        background-position: 200%;
      }
    }

    .main-content {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
      max-width: 100%;
      box-sizing: border-box;
      flex-direction: row;
    }


    .webcam-frame,
    .chart-container {
      cursor: pointer;
      flex: 1 1 45%;
      background-color: var(--card-bg);
      padding: 0.75rem;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    .webcam-frame img {
      height: auto;
      transform-origin: center center;
      max-width: 100%;
      border-radius: 10px;
      display: block;
    }

    .chart-container canvas {
      max-height: 400px;
      display: block;
    }

    #chart-info {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #ccc;
      text-align: center;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      padding-top: 0.5rem;
      max-width: 100%;
    }

    .chart-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 100%;
    }

    .chart-buttons button {
      padding: 6px 10px;
      font-size: 0.85rem;
      border: none;
      background-color: var(--accent-blue);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .chart-buttons button:hover {
      background-color: #2563eb;
      box-shadow: 0 0 10px var(--accent-blue);
    }

    .chart-buttons button.active {
      background-color: var(--accent-green);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
      transform: scale(1.1);
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      100% {
        transform: scale(1.1);
      }
    }

    .watering-section {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem 0.5rem;
      flex-direction: column;
      text-align: center;
      max-width: 100%;
    }

    .watering-wrapper {
      display: inline-block;
      text-align: left;
      width: 100%;
    }

    .watering-wrapper label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--accent-blue);
    }

    .watering-frame {
      transition: opacity 0.3s ease;
      border: 2px solid #333;
      padding: 10px;
      border-radius: 10px;
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      width: 100%;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    .timelapse-frame {
      transition: opacity 0.3s ease;
      border: 2px solid #333;
      padding: 10px;
      border-radius: 10px;
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      width: 100%;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
      justify-content: space-evenly;
    }

    .watering-frame button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 0.95rem;
      cursor: pointer;
      width: 12rem;
      align-items: center;
    }

    .watering-frame button:hover {
      background-color: #45a099;
    }

    .watering-frame button:disabled {
      background-color: #661616;
    }

    .watering-frame input[type="range"] {
      width: 100%;
    }

    .watering-frame span {
      font-size: 15px;
      font-weight: bold;
    }

    .watering-frame label {
      font-size: 13px;
    }

    .watering-frame input[type="radio"] {
      margin-right: 5px;
    }

    .log-container {
      flex: 1 1 45%;
      background-color: var(--card-bg);
      padding: 0.75rem;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      max-width: 100%;
      box-sizing: border-box;
    }

    .log-section {
      display: flex;
      justify-content: center;
      padding: 2rem;
    }

    .log-title {
      margin-top: 0;
      font-size: 1.25rem;
      color: var(--accent-blue);
      margin-bottom: 1rem;
    }

    .log-output {
      background-color: #141414;
      /* Dark background for terminal effect */
      color: #ebe5e5;
      /* Light text */
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      border-radius: 8px;
      padding: 1rem;
      max-width: 100%;
      max-height: 300px;
      overflow-y: scroll;
      /* Force scrollbars on all platforms */
      white-space: pre-wrap;
      -webkit-overflow-scrolling: touch;
      /* iOS momentum scroll */
      overscroll-behavior: contain;
      /* Prevent parent scroll interference */
      touch-action: pan-y;
      /* Enable vertical gesture recognition */
    }

    .log-actions {
      text-align: right;
      margin-top: 1rem;
    }

    .reload-button {
      background-color: #4b5563;
      /* Button background */
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .custom-container {
      display: flex;
      justify-content: space-between;
      padding: 2rem;
      gap: 2rem;
      flex-direction: row;
    }

    #timelapse-image {
      width: 100%;
      border-radius: 12px;
      object-fit: contain;
    }

    .timelapse-controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .timelapse-button {
      flex: 1 1 45%;
      padding: 12px;
      font-size: 1.1rem;
      background-color: #007acc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .timelapse-button:hover {
      background-color: #005fa3;
    }

    .timelapse-button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    @media (max-width: 700px) {
      header {
        font-size: 2rem;
        padding: 1rem;
      }

      .main-content {
        padding: 0.5rem;
        align-items: center;
        flex-direction: row;
      }

      .webcam-frame,
      .chart-container {
        max-width: 100%;
        width: 100%;
        flex: none;
      }

      .chart-buttons {
        gap: 6px;
      }

      .chart-buttons button {
        flex: 1 1 auto;
        min-width: 80px;
      }

      .watering-section {
        padding: 0.5rem;
      }

      .custom-container {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-direction: column;
      }

      .lamp-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 1rem;
        justify-content: center;
      }
    }

    .growbot-log {
      width: 100%;
      min-height: 200px;
      background-color: #1f2937;
      /* slightly lighter dark */
      color: #f9fafb;
      /* light text for contrast */
      border: 1px solid #374151;
      /* subtle border */
      border-radius: 0.5rem;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.9rem;
      resize: vertical;
      box-sizing: border-box;
      line-height: 1.4;
      outline: none;
    }

    .growbot-log:focus {
      border-color: #3b82f6;
      /* blue border on focus */
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
    }



    /* Common style for all frames */
    .custom-frame {
      width: 100%;
      max-width: 700px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 1.5rem;
      font-family: system-ui, sans-serif;
      border: 1px solid #e5e7eb;
    }

    /* Title style within each frame */
    .custom-frame-title {
      margin: 0 0 1rem;
      font-size: 1.25rem;
      color: #3b82f6;
    }

    /* Container for the buttons within the Server Handling frame */
    .server-button-container {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      justify-content: flex-start;
    }

    /* Common button styles */
    .server-button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: auto;
    }

    /* Specific color for Start Server button */
    .resrestart-runtimeServer-cameraBtn {
      background-color: #4caf50;
      /* Green */
      color: white;
    }

    /* Specific color for Restart Server button */
    .restart-system-cameraBtn {
      background-color: #f44336;
      /* Red */
      color: white;
    }

    .server-button-container-vertical {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
      align-items: center;
    }

    .server-button:hover {
      opacity: 0.9;
    }

    .custom-input-container {
      margin: 20px;
      display: flex;
      gap: 10px;
    }

    .custom-input {
      width: 80%;
      padding: 10px;
      font-size: 1rem;
      background-color: #333;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
    }

    .custom-button {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .custom-button:hover {
      background-color: #45a049;
    }

    .custom-output {
      width: 100%;
      height: 300px;
      margin-top: 20px;
      background-color: #111;
      color: #f1f1f1;
      padding: 10px;
      font-family: monospace;
      border-radius: 4px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .status-card {
      background-color: #1e1e1e;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
    }

    .lamp-container {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      justify-content: center;
    }

    .lamp {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: gray;
      box-shadow: 0 0 10px #000;
      transition: background-color 0.3s;
    }

    .label {
      text-align: center;
      margin-top: 0.5rem;
    }

    .lamp-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .webcam-frame {
      cursor: pointer;
      display: inline-block;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s ease;
      max-width: 100%;
    }

    .webcam-frame.fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .webcam-frame img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .webcam-frame.fullscreen img {
      max-width: 100%;
      max-height: 100%;
    }

    .chart-frame {
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s ease;
      max-width: 100%;
      height: 400px;
    }

    .chart-frame.fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chart-frame canvas {
      max-width: 100%;
      max-height: 400px;
    }

    .chart-frame.fullscreen canvas {
      max-width: 90%;
      max-height: 90%;
    }

    #timelapse-caption {
      font-size: 0.9rem;
    }

    .timelapse-button {
      font-size: 1rem;
      padding: 10px;
    }
  </style>

</head>

<body>
  <header>JSD's GrowBot</header>

  <!-- Webcam and Chart -->
  <div class="main-content">
    <div class="webcam-frame" id="webcamFrame">
      <img src="/stream?action=stream" id="webcamstream" class="webcamstream" alt="Webcam Feed">
    </div>

    <div class="chart-container">
      <div class="chart-frame" id="chartFrame">
        <canvas id="myChart"></canvas>
      </div>
      <div id="chart-info"></div>
      <div class="button-container">
        <div class="chart-buttons">
          <button onclick="setDataLimit('all')">All</button>
          <button onclick="setDataLimit(1440)">1d</button>
          <button onclick="setDataLimit(360)">6h</button>
          <button onclick="setDataLimit(120)">2h</button>
          <button onclick="setDataLimit(30)">30m</button>
          <button onclick="setDataLimit(10)">10m</button>
        </div>
      </div>
    </div>
  </div>

  <div class="status-card">
    <div class="label">
      <div>
        <label id="uptime"></label>
      </div>
    </div>
    <div class="label">
      <div>Connected clients:
        <label id="clientsConnected"></label>
      </div>
    </div>
    <div class="label">
      <div>
        <label id="temperature"></label>
      </div>
    </div>
    <div class="label">
      <div>
        <label id="latest_moist"></label>
      </div>
    </div>
    <div class="lamp-container">
      <div class="lamp-wrapper">
        <div id="lamp-statusRuntimeServer" class="lamp"></div>
        <div class="label">statusRuntimeServer</div>
      </div>
      <div class="lamp-wrapper">
        <div id="lamp-statusWebserver" class="lamp"></div>
        <div class="label">statusWebserver</div>
      </div>
      <div class="lamp-wrapper">
        <div id="lamp-statusCamera" class="lamp"></div>
        <div class="label">statusCamera</div>
      </div>
      <div class="lamp-wrapper">
        <div id="lamp-statusSprayer" class="lamp"></div>
        <div class="label">statusSprayer</div>
      </div>
    </div>
  </div>

  <div class="custom-container">
    <!-- Watering Frame -->
    <div class="watering-wrapper">
      <h2 class="custom-frame-title">Watering System</h2>
      <label><input type="checkbox" id="override-checkbox"> Override</label>
      <div class="watering-frame" id="watering-frame">

        <button id="water-button" onclick="triggerWater()">Water</button>

        <label for="water-level">Water Level (1–5)</label>
        <input type="range" id="water-level" min="1" max="5" value="2" oninput="updateWaterLevel(this.value)">
        <span id="water-level-value">2</span>

        <div>
          <label><input type="radio" name="pump" value="pump0" checked> Top</label>
          <label><input type="radio" name="pump" value="pump1"> Bottom</label>
        </div>
      </div>
    </div>

    <!-- Control Frame -->
    <div class="watering-wrapper">
      <h2 class="custom-frame-title">Server Handling</h2>
      <div class="watering-frame" id="watering-frame">
        <table style="width: 100%; border-collapse: separate; border-spacing: 1rem;">
          <tr>
            <td valign="top">
              <div class="server-button-container-vertical">
                <button class="server-button" onclick="toggleCamera()" id="toggle-button">Toggle Camera</button>
                <button class="server-button" onclick="sendServerCommand('clearServerLogs')">Clear Server Logs</button>
                <button class="server-button" onclick="sendServerCommand('clearMoistLogs')">Clear Moister Logs</button>
                <button class="server-button" onclick="toggleSprayer()" id="sprayer-button">Toggle Sprayer</button>
              </div>
            </td>
            <td valign="top">
              <div class="server-button-container-vertical">
                <button class="server-button" onclick="sendServerCommand('restartRuntimeServer')">Restart Runtime
                  Server</button>
                <button class="server-button" onclick="sendServerCommand('restartWebServer')">Restart Webserver</button>
                <button class="server-button" onclick="sendServerCommand('restartMoistMeasure')">Restart Moist
                  Measurement ECU</button>
                <button class="server-button" onclick="sendServerCommand('restartSystem')">Restart System</button>
              </div>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </div>

<div class="custom-container">
  <div class="watering-wrapper">
    <div class="log-container">
      <h2 class="log-title">Pump Log</h2>

      <div id="pump-log" class="log-output"></div>

      <div class="log-actions">
        <button onclick="reloadLogs()" class="reload-button">Reload Logs</button>
      </div>
    </div>
  </div>

  <!-- Cleaned-up timelapse-frame without redundant wrapping -->
  <div id="timelapse-frame" class="timelapse-frame">
    <img id="timelapse-image" src="" alt="Timelapse Image">
    <div id="timelapse-caption" style="font-weight: bold;"></div>
    <div id="timelapse-counter" style="color: #666;"></div>
    <div style="margin-top: 12px;">
      <button onclick="prevImage()">Previous</button>
      <button onclick="nextImage()">Next</button>
    </div>
  </div>
</div>

  <script>
    let myChartInstance = null;
    let fullData = { times: [], soil_top: [], soil_bottom: [], atomizer: [], temperature: [], humidity: [] };
    let currentLimit = 30;
    let MOISTER_OFFSET = 170;
    let CSVErros = 0;

    let serviceRunning = false;
    let statusCamera = "inactive";
    let statusSprayer = "inactive";

    const cameraBtn = document.getElementById('toggle-button');
    const sprayerBtn = document.getElementById('sprayer-button');

    const webcamFrame = document.getElementById('webcamFrame');
    const chartFrame = document.getElementById('chartFrame');
    const timelapseFrame = document.getElementById('timelapse-frame');
    const timelapseImage = document.getElementById('timelapse-image');


    // Block fullscreen until logged in
    let isLoggedIn = false;

    let timelapseIndex = 0;
    let timelapseFilenames = [];

    function loadImage(index) {
      const filename = timelapseFilenames[index];
      document.getElementById('timelapse-image').src = `webcam_photos/${filename}`;

      // Caption formatting
      const match = filename.match(/photo_(\d{4}-\d{2}-\d{2})_(\d{2})-(\d{2})\.jpg/);
      if (match) {
        const [, date, hour, minute] = match;
        const formatted = `${date} ${hour}:${minute}`;
        document.getElementById('timelapse-caption').innerText = formatted;
      } else {
        document.getElementById('timelapse-caption').innerText = "Unknown timestamp";
      }

      // Update image counter (e.g., 3 / 10)
      document.getElementById('timelapse-counter').innerText = `${index + 1} / ${timelapseFilenames.length}`;
    }

    function nextImage() {
      timelapseIndex = (timelapseIndex + 1) % timelapseFilenames.length;
      loadImage(timelapseIndex);
    }

    function prevImage() {
      timelapseIndex = (timelapseIndex - 1 + timelapseFilenames.length) % timelapseFilenames.length;
      loadImage(timelapseIndex);
    }

    // Load timestamps.json
    fetch("webcam_photos/timestamps.json")
      .then(res => res.json())
      .then(data => {
        timelapseFilenames = data.map(f => f.trim()).filter(f => f.endsWith('.jpg'));
        if (timelapseFilenames.length > 0) {
          loadImage(timelapseIndex);
        }
      })
      .catch(err => console.error(`Error loading timestamps: ${err.message}`));



    chartFrame.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        chartFrame.classList.add('fullscreen');
        chartFrame.requestFullscreen().catch(err => {
          console.error(`Error trying to enable full-screen mode: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });

    timelapseImage.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        timelapseFrame.classList.add('fullscreen');
        timelapseFrame.requestFullscreen().catch(err => {
          console.error(`Error trying to enable full-screen mode: ${err.message}`);
        });
        document.getElementById('timelapse-frame').style.padding = "0px";
        document.getElementById('timelapse-frame').style.gap = "0px";
        document.getElementById('timelapse-image').style.maxHeight = "80%";
        document.getElementById('timelapse-counter').style.fontSize = "10px";
        document.getElementById('timelapse-caption').style.marginTop = "10px";
      }
    });

    timelapseImage.addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
        document.getElementById('timelapse-frame').style.padding = "10px";
        document.getElementById('timelapse-frame').style.gap = "8px";
        document.getElementById('timelapse-image').style.maxHeight = "100%";
        document.getElementById('timelapse-counter').style.fontSize = "10px";
        document.getElementById('timelapse-caption').style.marginTop = "0px";
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        chartFrame.classList.remove('fullscreen');
      }
    });

    webcamFrame.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        webcamFrame.classList.add('fullscreen');
        webcamFrame.requestFullscreen().catch(err => {
          console.error(`Error trying to enable full-screen mode: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        webcamFrame.classList.remove('fullscreen');
      }
    });

    const updateLamp = (id, state) => {
      document.getElementById('temperature').textContent = "Temperature: " + fullData.temperature[fullData.temperature.length - 1] + "°C, Humidity: " + fullData.humidity[fullData.humidity.length - 1] + "%";
      document.getElementById('latest_moist').textContent = "Soil top: " + fullData.soil_top[fullData.soil_top.length - 1] + ", Soil bottom: " + fullData.soil_bottom[fullData.soil_bottom.length - 1];
      if (id === "statusClients") {
        document.getElementById('clientsConnected').textContent = state.trim();
        return; // return as statusClients has no lamp!
      }
      if (id === "statusUptime") {
        document.getElementById('uptime').textContent = state.trim();
        return; // return as Uptime has no lamp!
      }
      if (id === "statusCamera") {
        statusCamera = state.trim()
        if (statusCamera === "active") {
          cameraBtn.textContent = "Stop Camera";
          cameraBtn.style.backgroundColor = "tomato";
        }
        else if (statusCamera === "inactive") {
          cameraBtn.textContent = "Start Camera";
          cameraBtn.style.backgroundColor = "#4CAF50";
        }
      }
      if (id === "statusSprayer") {
        statusSprayer = state.trim()
        if (statusSprayer === "active") {
          sprayerBtn.textContent = "Stop Sprayer";
          sprayerBtn.style.backgroundColor = "tomato";
        }
        else if (statusSprayer === "inactive") {
          sprayerBtn.textContent = "Start Sprayer";
          sprayerBtn.style.backgroundColor = "#4CAF50";
        }
      }

      const lamp = document.getElementById(`lamp-${id}`);
      lamp.style.backgroundColor = state.trim() === "active" ? "#005e00" : "#990000";
    };

    function toggleCamera() {
      if (statusCamera.trim() === "inactive") {
        sendServerCommand("startCamera");  // Send command to stop camera

        statusCamera = "active";  // Toggle state to active
        setTimeout(() => {
          let imageElement = document.getElementById("webcamstream");
          imageElement.src = "/stream?action=stream&t=" + new Date().getTime();
        }, 2000);
      } else if (statusCamera.trim() === "active") {
        sendServerCommand("stopCamera");  // Send command to start camera

        statusCamera = "inactive";  // Toggle state to inactive
        let imageElement = document.getElementById("webcamstream");
        // Replace the webcam image with a message when deactivated
        imageElement.src = "";  // Stops the webcam feed
      }
    }

    function toggleSprayer() {
      if (statusSprayer.trim() === "inactive") {
        sendServerCommand("startSprayer");  // Send command to stop camera
        statusSprayer = "active";  // Toggle state to active
      } else if (statusSprayer.trim() === "active") {
        sendServerCommand("stopSprayer");  // Send command to start camera
        statusSprayer = "inactive";  // Toggle state to inactive
      }
    }


    const checkStatus = () => {
      ["statusRuntimeServer", "statusWebserver", "statusCamera", "statusClients", "statusUptime", "statusSprayer"].forEach(key => {
        fetch('/control', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ command: key })
        })
          .then(res => res.json())
          .then(json => {
            updateLamp(key, json.message);
          })
          .catch(err => {
            console.error(`Error fetching status for ${key}:`, err);
          });
      });
    };

    function sendServerCommand(command) {
      // Show a confirmation dialog before sending the request
      const userConfirmed = confirm(`Are you sure you want to trigger the execution of ${command}?\nThe services may be unavailable for a few minutes until the are restarted!`);

      if (userConfirmed) {
        fetch('/control', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ command: command }),
        })
          .then(response => response.json())
          .then(data => {
            console.log("## key: " + command + " # fetching message " + data.message); // Handle response from Flask
          })
          .catch(error => {
            console.error('Error: ', error);
          });
      } else {
        console.log("Control cancelled by user.");
      }
    }

    function reloadLogs() {
      fetch('moist_log.csv')
        .then(response => {
          if (!response.ok) throw new Error("Failed to load log");
          return response.text();
        })
        .then(logText => {
          const pre = document.getElementById('pump-log');
          pre.textContent = logText;
          pre.scrollTop = pre.scrollHeight;
        })
        .catch(err => {
          console.error("Error loading logs:", err);
          document.getElementById('pump-log').textContent = "Error loading log file.";
        });
    }

    // Function to scroll the iframe content to the bottom
    function scrollToBottom(iframeId) {
      const iframe = document.getElementById(iframeId);
      try {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        iframeDoc.documentElement.scrollTop = iframeDoc.body.scrollHeight;
      } catch (e) {
        console.error('Unable to access iframe content:', e);
      }
    }

    // Initial load of logs
    reloadLogs();

    // Wait until the DOM is fully loaded before accessing elements
    document.addEventListener('DOMContentLoaded', function () {
      const waterButton = document.getElementById('water-button');
      const overrideCheckbox = document.getElementById('override-checkbox');
      const wateringFrame = document.getElementById('watering-frame');

      // Ensure that the elements exist
      if (!waterButton || !overrideCheckbox || !wateringFrame) {
        console.error("Error: One or more required elements are missing in the DOM." + waterButton + " # " + overrideCheckbox + " # " + wateringFrame + " ##");
        return;
      }

      // Function to enable or disable the Water button based on the checkbox status
      function toggleWaterButton() {
        console.log('Override Checkbox Checked:', overrideCheckbox.checked);

        // If the checkbox is checked, enable the Water button; otherwise, disable it
        waterButton.disabled = !overrideCheckbox.checked;

        // If the checkbox is unchecked, disable the whole watering frame and gray it out
        if (overrideCheckbox.checked) {
          wateringFrame.style.pointerEvents = 'auto';  // Enable interactions
          wateringFrame.style.opacity = '1';  // Restore opacity
        } else {
          wateringFrame.style.pointerEvents = 'none';  // Disable interactions
          wateringFrame.style.opacity = '0.5';  // Apply gray out effect
        }
      }

      // Attach the toggle function to the checkbox event listener
      overrideCheckbox.addEventListener('click', toggleWaterButton);

      // Initialize button state on page load based on checkbox status
      toggleWaterButton(); // To handle initial state based on checkbox status
    });

    // Trigger the watering request after confirmation
    function triggerWater() {
      const waterLevel = document.getElementById('water-level').value; // Get the current slider value
      const pumpSelection = document.querySelector('input[name="pump"]:checked').value; // Get selected pump (pump0 or pump1)

      // Show a confirmation dialog before sending the request
      const userConfirmed = confirm(`Are you sure you want to water with Pump ${pumpSelection} at level ${waterLevel}?`);

      if (userConfirmed) {
        // Send the water level and pump selection to the Flask backend if confirmed
        fetch('/water', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            water_duration: waterLevel,
            pump_selection: pumpSelection
          })
        })
          .then(async response => {
            const contentType = response.headers.get("content-type");
            if (!response.ok) {
              const errorText = await response.text();
              console.error("Server returned error:", errorText);
              throw new Error("Server error");
            }
            if (contentType && contentType.includes("application/json")) {
              return response.json();
            } else {
              throw new TypeError("Expected JSON, got: " + contentType);
            }
          })
          .then(data => {
            console.log('Water triggered: ', data);
          })
          .catch(error => {
            console.error('Water trigger error: ', error);
            alert("Failed to trigger watering.");
          });
      } else {
        console.log("Watering cancelled by user.");
      }
    }

    // Update the value of the slider as it's moved
    function updateWaterLevel(value) {
      document.getElementById('water-level-value').textContent = value;
    }


    // For setting data limit (chart buttons)
    function setDataLimit(limit) {
      // Your code for handling data limit
      console.log(`Data limit set to: ${limit}`);
    }

    async function fetchCSV() {
      try {
        const response = await fetch('moist_log.csv');
        const data = await response.text();
        const rows = data.split("\n");//.slice(1); // Skip header
        CSVErros = 0;

        fullData.times = [];
        fullData.soil_top = [];
        fullData.soil_bottom = [];
        fullData.atomizer = [];
        fullData.temperature = [];
        fullData.humidity = [];

        rows.forEach(row => {
          const [time, val0, val1, val2, val3, val4] = row.split(",");
          if (time && val0 && val1) {
            fullData.times.push(time.trim());
            fullData.soil_top.push(MOISTER_OFFSET - parseInt(val0.trim() / 3, 10));
            fullData.soil_bottom.push(MOISTER_OFFSET - parseInt(val1.trim() / 3, 10));
            fullData.atomizer.push(parseInt(val2.trim(), 10));
            temp = parseFloat(val3.trim());
            humi = parseFloat(val4.trim());
            if (temp === 0.0) {
              CSVErros += 1;
              fullData.temperature.push(fullData.temperature[fullData.temperature.length - 2]);
            }
            else {
              fullData.temperature.push(temp);
            }
            if (humi === 0.0) {
              fullData.humidity.push(fullData.humidity[fullData.humidity.length - 2]);
            }
            else {
              fullData.humidity.push(humi);
            }
          }
        });

        renderChartWithLimit();
      } catch (error) {
        console.error("Error fetching CSV:", error);
      }
    }

    function setDataLimit(limit) {
      currentLimit = limit;
      renderChartWithLimit();

      const buttons = document.querySelectorAll('.button-container button');
      buttons.forEach(cameraBtn => cameraBtn.classList.remove('active'));
    }

    function renderChartWithLimit() {
      let { times, soil_top, soil_bottom, atomizer, temperature, humidity } = fullData;

      if (!times.length) return;

      let startTime = times[0];
      let endTime = times[times.length - 1];
      let entryCount = times.length;
      times = times.slice(-currentLimit);
      soil_top = soil_top.slice(-currentLimit);
      soil_bottom = soil_bottom.slice(-currentLimit);
      atomizer = atomizer.slice(-currentLimit);
      temperature = temperature.slice(-currentLimit);
      humidity = humidity.slice(-currentLimit);
      updateChart(times, soil_top, soil_bottom, temperature, humidity);

      const start = parseTimeToDate(fullData.times[0]);
      const end = parseTimeToDate(fullData.times[fullData.times.length - 1]);

      totalSeconds = fullData.times.length * 60;
      const days = Math.floor(totalSeconds / (24 * 3600));
      totalSeconds %= 24 * 3600;

      const hours = Math.floor(totalSeconds / 3600);
      totalSeconds %= 3600;

      const minutes = Math.floor(totalSeconds / 60);

      // Optional: const seconds = totalSeconds % 60;

      const duration = [
        days > 0 ? `${days}d` : null,
        (hours > 0 || days > 0) ? `${hours}h` : null,
        `${minutes}m`
      ].filter(Boolean).join(" ");
      // Calculate min and max values for both soil_top and soil_bottom
      const soil_topMin = Math.min(...fullData.soil_top);
      const soil_topMax = Math.max(...fullData.soil_top);
      const soil_bottomMin = Math.min(...fullData.soil_bottom);
      const soil_bottomMax = Math.max(...fullData.soil_bottom);
      // For temp and humi, filter failed measures
      const temperatureMin = Math.min(
        ...fullData.temperature
          .filter(val => val !== '0' && val !== 0)
          .map(val => parseFloat(val))
          .filter(val => !isNaN(val))
      );
      const temperatureMax = Math.max(
        ...fullData.temperature
          .filter(val => val !== '*')
          .map(val => parseFloat(val))
          .filter(val => !isNaN(val))
      );
      const humidityMin = Math.min(
        ...fullData.humidity
          .filter(val => val !== '0' && val !== 0)
          .map(val => parseFloat(val))
          .filter(val => !isNaN(val))
      );
      const humidityMax = Math.max(
        ...fullData.humidity
          .filter(val => val !== '*')
          .map(val => parseFloat(val))
          .filter(val => !isNaN(val))
      );


      const infoBox = document.getElementById('chart-info');
      infoBox.innerHTML = `
  📅 <strong>Start:</strong> ${start.toLocaleTimeString()} &nbsp; |
  🧮 <strong>Entries:</strong> ${fullData.times.length} &nbsp;, <strong>Errors:</strong> ${CSVErros}|
  ⏱️ <strong>Duration:</strong> ${duration} &nbsp;
  <br>
  📈 <strong>soil_top:</strong> min ${soil_topMin}, max ${soil_topMax} &nbsp; |
  📉 <strong>soil_bottom:</strong> min ${soil_bottomMin}, max ${soil_bottomMax}
  📉 <strong>temperature:</strong> min ${temperatureMin}, max ${temperatureMax}
  📉 <strong>humidity:</strong> min ${humidityMin}, max ${humidityMax}

`;

    }

    function parseTimeToDate(timeStr) {
      const [hours, minutes, seconds] = timeStr.split(":").map(num => parseInt(num, 10));
      const now = new Date();
      now.setHours(hours, minutes, seconds, 0); // Set to today's date with the given time
      return now;
    }

    function updateChart(times, soil_top, soil_bottom, temperature, humidity) {
      if (myChartInstance) {
        myChartInstance.data.labels = times;
        myChartInstance.data.datasets[0].data = soil_top;
        myChartInstance.data.datasets[1].data = soil_bottom;
        //myChartInstance.data.datasets[2].data = atomizer * 400;
        myChartInstance.data.datasets[2].data = temperature;
        myChartInstance.data.datasets[3].data = humidity;
        myChartInstance.update();
      } else {
        const ctx = document.getElementById('myChart').getContext('2d');
        myChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: times,
            datasets: [
              {
                label: 'Top',
                data: soil_top,
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.15)',
                borderWidth: 2,
                fill: true,
                tension: 0.4,
                pointRadius: 0
              },
              {
                label: 'Bottom',
                data: soil_bottom,
                borderColor: '#10b981',
                backgroundColor: 'rgba(16, 185, 129, 0.15)',
                borderWidth: 2,
                fill: true,
                tension: 0.4,
                pointRadius: 0
              },
              {
                label: 'Temperature',
                data: temperature,
                borderColor: '#ef4444',
                backgroundColor: 'rgba(220, 150, 60, 0.15)',
                borderWidth: 2,
                fill: true,
                tension: 0.4,
                pointRadius: 0
              },
              {
                label: 'Humidity',
                data: humidity,
                borderColor: '#eab308',
                backgroundColor: 'rgba(200, 185, 12, 0.15)',
                borderWidth: 2,
                fill: true,
                tension: 0.4,
                pointRadius: 0
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: 'index',
              intersect: false
            },
            plugins: {
              title: {
                display: true,
                text: 'Soil Moisture Levels',
                color: '#fff',
                font: {
                  size: 20,
                  weight: 'bold'
                }
              },
              tooltip: {
                backgroundColor: '#222',
                titleColor: '#fff',
                bodyColor: '#eee',
                cornerRadius: 5,
                padding: 10
              },
              legend: {
                labels: {
                  color: '#ccc',
                  font: {
                    size: 14
                  }
                }
              }
            },
            scales: {
              x: {
                ticks: {
                  color: '#aaa'
                },
                title: {
                  display: true,
                  text: 'Time',
                  color: '#ccc'
                },
                grid: {
                  color: '#333'
                }
              },
              y: {
                ticks: {
                  color: '#aaa'
                },
                title: {
                  display: true,
                  text: 'Value',
                  color: '#ccc'
                },
                grid: {
                  color: '#333'
                },
                beginAtZero: true
              },
            },
            animation: {
              duration: 700,
              easing: 'easeOutQuart'
            }
          }
        });

      }
    }

    fetchCSV();
    checkStatus();
    setDataLimit(10);
    setInterval(fetchCSV, 10000);
    setInterval(checkStatus, 10000);

    // Auto-load logs on page load
    document.addEventListener('DOMContentLoaded', reloadLogs);
  </script>
</body>

</html>
