<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chart.js on Apache</title>
        <!-- Load Chart.js first -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            /* Center and fix the graph size */
            .chart-container {
                width: 500px;  /* Fixed width */
                height: 300px; /* Fixed height */
                position: relative; /* Absolute positioning */
                border: 2px solid black; /* Optional: Adds a border */
                background-color: white; /* Ensures visibility */
                display: flex;
                justify-content: center;
                align-items: center;
            }
    
            /* Fix the canvas size */
            canvas {
                width: 100% !important;
                height: 100% !important;
            }
        </style>
    </head>
<body>
    <h1>This samples a video frame with embedded media</h1>
    <video width="640" height="360" controls>
        <source src="output.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h2>Live Updating Line Chart</h2>
    
    <div class="chart-container">
        <canvas id="myChart" width="400" height="200"></canvas>
    </div>
    
    <script>
        let chart; // Store chart instance

        async function fetchCSV() {
            try {
                const response = await fetch('moister_log.csv?' + new Date().getTime()); // Prevent caching
                const data = await response.text();
                const rows = data.split("\n").slice(1);

                let labels = [], values = [];

                rows.forEach(row => {
                    const [label, value] = row.split(",");
                    labels.push(label);
                    values.push(parseFloat(value));
                });

                updateChart(labels, values);
            } catch (error) {
                console.error("Error fetching CSV:", error);
            }
        }

        function createChart(labels, values) {
            const ctx = document.getElementById('myChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Live Data',
                        data: values,
                        borderColor: 'blue',
                        borderWidth: 2,
                        fill: false
                    }]
                }
            });
        }

        function updateChart(labels, values) {
            if (chart) {
                chart.data.labels = labels;
                chart.data.datasets[0].data = values;
                chart.update();
            } else {
                createChart(labels, values);
            }
        }

        // Fetch data and update chart every 5 seconds
        fetchCSV(); // Initial fetch
        setInterval(fetchCSV, 5000);
    </script>
</body>
</html>
