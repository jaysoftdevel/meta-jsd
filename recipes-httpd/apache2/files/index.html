<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrowBot Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-color: #1e1e2f;
      --card-bg: #2c2c3e;
      --text-color: #f1f1f1;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --header-gradient: linear-gradient(45deg, #6a5acd, #3b82f6, #10b981);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 1rem;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
    }

    header {
      text-align: center;
      font-size: 2.5rem;
      font-weight: bold;
      background: var(--header-gradient);
      background-size: 200%;
      color: transparent;
      padding: 1rem 0.5rem;
      background-clip: text;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      0% { background-position: -200%; }
      100% { background-position: 200%; }
    }

    .main-content {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
      max-width: 100%;
      box-sizing: border-box;
    }

    .webcam-frame,
    .chart-container {
      cursor: pointer;
      flex: 1 1 45%;
      background-color: var(--card-bg);
      padding: 0.75rem;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    .webcam-frame img,
    .chart-container canvas {
      max-width: 100%;
      min-height: 30rem;
      display: block;
    }

    .chart-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .chart-buttons button {
      padding: 6px 10px;
      font-size: 0.85rem;
      background-color: var(--accent-blue);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .chart-buttons button:hover {
      background-color: #2563eb;
      box-shadow: 0 0 10px var(--accent-blue);
    }

    .chart-buttons button.active {
      background-color: var(--accent-green);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
      transform: scale(1.1);
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    .watering-section {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }

    .watering-frame {
      padding: 10px;
      background-color: var(--card-bg);
      border: 2px solid #333;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .watering-frame button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .log-container {
      flex: 1 1 45%;
      background-color: var(--card-bg);
      padding: 0.75rem;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 768px) {
      header {
        font-size: 2rem;
        padding: 1rem;
      }

      .main-content {
        padding: 0.5rem;
        align-items: center;
      }

      .webcam-frame,
      .chart-container {
        max-width: 100%;
        width: 100%;
        flex: none;
      }

      .chart-buttons button {
        flex: 1 1 auto;
        min-width: 80px;
      }

      .watering-frame {
        width: 100%;
      }

      .watering-section {
        padding: 0.5rem;
      }
    }

    .status-table {
      width: 100%;
      margin: 0 auto;
      border-collapse: collapse;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      background-color: #fff;
      border-radius: 8px;
    }

    .status-table th,
    .status-table td {
      padding: 12px 20px;
      text-align: left;
      border: 1px solid #ddd;
    }

    .status-table th {
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
    }

    .status-table td {
      background-color: #f9f9f9;
    }

    .lamp-wrapper {
      display: flex;
      align-items: center;
    }

    .lamp-wrapper .label {
      margin-left: 10px;
    }

    @media (max-width: 768px) {
      .status-table th,
      .status-table td {
        padding: 10px 15px;
      }

      .status-table td {
        font-size: 14px;
      }

      .lamp-wrapper {
        flex-direction: column;
        align-items: flex-start;
      }

      .lamp-wrapper .label {
        margin-left: 0;
        margin-top: 5px;
      }
    }

    @media (max-width: 480px) {
      .status-table th,
      .status-table td {
        padding: 8px 10px;
      }

      .status-table td {
        font-size: 12px;
      }

      .lamp-wrapper {
        justify-content: center;
        align-items: center;
      }

      .lamp-wrapper .label {
        margin-top: 2px;
      }
    }
  </style>


</head>

<body>
  <!-- Login Modal HTML -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-modal">
      <h2>Login</h2>
      <form onsubmit="handleLogin(event)">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </div>
  </div>

  <button id="logoutBtn" onclick="handleLogout()">Logout</button>

  <header>JSD's GrowBot</header>

  <!-- Webcam and Chart -->
  <div class="main-content">
    <div class="webcam-frame"  id="webcamFrame">
      <img src="/stream?action=stream" id="webcamstream" class="webcamstream" alt="Webcam Feed">
    </div>

    <div class="chart-container">
      <div class="chart-frame" id="chartFrame">
        <canvas id="myChart"></canvas>
      </div>
      <div id="chart-info"></div>
      <div class="button-container">
        <div class="chart-buttons">
          <button onclick="setDataLimit('all')">All</button>
          <button onclick="setDataLimit(1440)">1d</button>
          <button onclick="setDataLimit(360)">6h</button>
          <button onclick="setDataLimit(120)">2h</button>
          <button onclick="setDataLimit(30)">30m</button>
          <button onclick="setDataLimit(10)">10m</button>
        </div>
      </div>
    </div>
  </div>

  <table class="status-table">
    <thead>
      <tr>
        <th>Metric</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Connected clients:</td>
        <td><label id="clientsConnected">0</label></td>
      </tr>
      <tr>
        <td>Uptime:</td>
        <td><label id="uptime">0d 00h 00m</label></td>
      </tr>
      <tr>
        <td>Temperature:</td>
        <td><label id="temperature">25°C</label></td>
      </tr>
      <tr>
        <td>Status Runtime Server:</td>
        <td class="lamp-wrapper">
          <div id="lamp-statusRuntimeServer" class="lamp lamp-green"></div>
          <div class="label">Online</div>
        </td>
      </tr>
      <tr>
        <td>Status Moisture:</td>
        <td class="lamp-wrapper">
          <div id="lamp-statusMoister" class="lamp lamp-red"></div>
          <div class="label">Offline</div>
        </td>
      </tr>
      <tr>
        <td>Status Webserver:</td>
        <td class="lamp-wrapper">
          <div id="lamp-statusWebserver" class="lamp lamp-yellow"></div>
          <div class="label">Warning</div>
        </td>
      </tr>
      <tr>
        <td>Status Camera:</td>
        <td class="lamp-wrapper">
          <div id="lamp-statusCamera" class="lamp lamp-off"></div>
          <div class="label">Offline</div>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="custom-container">
    <!-- Watering Frame -->
    <h2 class="custom-frame-title">Watering System</h2>
    <div class="watering-wrapper">
      <label><input type="checkbox" id="override-checkbox"> Override</label>

      <div class="watering-frame" id="watering-frame">
        <button id="water-button" onclick="triggerWater()">Water</button>

        <label for="water-level">Water Level (1-5)</label>
        <input type="range" id="water-level" min="1" max="5" value="2" oninput="updateWaterLevel(this.value)">
        <span id="water-level-value">2</span>

        <div>
          <label><input type="radio" name="pump" value="pump0" checked>Top</label>
          <label><input type="radio" name="pump" value="pump1">Bottom</label>
        </div>
      </div>
    </div>

    <h2 class="custom-frame-title">Server Handling</h2>
    <div class="watering-frame" id="watering-frame">
      <!-- Button Container with Two Columns -->
      <div style="display: flex; gap: 150px;">

        <div class="server-button-container-vertical">
          <button id="toggle-button" class="server-button resrestart-runtimeServer-btn" onclick="toggleCamera()">
            Toggle Camera
          </button>
          <button class="server-button resrestart-runtimeServer-btn" onclick="sendServerCommand('clearServerLogs')">
            Clear Server Logs
          </button>
          <button class="server-button resrestart-runtimeServer-btn" onclick="sendServerCommand('clearMoistLogs')">
            Clear Moister Logs
          </button>
        </div>

        <!-- Right Column (Existing Buttons) -->
        <div class="server-button-container-vertical">
          <button onclick="sendServerCommand('restartRuntimeServer')" class="server-button">
            Restart Runtime Server
          </button>
          <button onclick="sendServerCommand('restartWebServer')" class="server-button">
            Restart Webserver
          </button>
          <button onclick="sendServerCommand('restartMoistLogger')" class="server-button">
            Restart Moist Logger
          </button>
          <button onclick="sendServerCommand('restartMoistMeasure')" class="server-button">
            Restart Moist Measurement ECU
          </button>
          <button onclick="sendServerCommand('restartSystem')" class="server-button">
            Restart System
          </button>
        </div>

      </div>
    </div>


  </div>
  </div>

  <div class="log-section" style="display: flex; justify-content: center; padding: 2rem;">
    <div class="log-container">
      <h2 style="margin-top: 0; font-size: 1.25rem; color: var(--accent-blue); margin-bottom: 1rem;">
        Pump Log
      </h2>

      <div style="
        background-color: #141414; /* Dark background for terminal effect */
        color: #ebe5e5; /* Light text */
        font-family: 'Courier New', monospace;
        font-size: 0.85rem;
        border-radius: 8px;
        padding: 1rem;
        max-height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
      " id="pump-log"></div>

      <div style="text-align: right; margin-top: 1rem;">
        <button onclick="reloadLogs()" style="
          background-color: #4b5563; /* Button background */
          color: white;
          border: none;
          padding: 0.5rem 1rem;
          border-radius: 6px;
          cursor: pointer;
          font-size: 0.9rem;
        ">
          Reload Logs
        </button>
      </div>
    </div>
  </div>

  <script>
    let myChartInstance = null;
    let fullData = { times: [], data0: [], data1: [] };
    let currentLimit = 30;

    let serviceRunning = false;
    let statusCamera = "inactive";

    const btn = document.getElementById('toggle-button');
    const webcamFrame = document.getElementById('webcamFrame');
    const chartFrame = document.getElementById('chartFrame');
    const loginOverlay = document.getElementById('loginOverlay');
    const logoutBtn = document.getElementById('logoutBtn');

    // Block fullscreen until logged in
    let isLoggedIn = false;

    chartFrame.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        chartFrame.classList.add('fullscreen');
        chartFrame.requestFullscreen().catch(err => {
          console.error(`Error trying to enable full-screen mode: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        chartFrame.classList.remove('fullscreen');
      }
    });

    webcamFrame.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        webcamFrame.classList.add('fullscreen');
        webcamFrame.requestFullscreen().catch(err => {
          console.error(`Error trying to enable full-screen mode: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        webcamFrame.classList.remove('fullscreen');
      }
    });

    const updateLamp = (id, state) => {

      if (id === "statusClients") {
        document.getElementById('clientsConnected').textContent = state.trim();
        return;
      }
      if (id === "statusUptime") {
        document.getElementById('uptime').textContent = state.trim();
        return;
      }
      if(id === "statusCamera"){
        statusCamera = state.trim()
        if (statusCamera === "active") {
          btn.textContent = "Stop Camera";  // Update button text
          btn.style.backgroundColor = "tomato";
        }
        else if (statusCamera === "inactive") {
          btn.textContent = "Start Camera";  // Update button text
          btn.style.backgroundColor = "#4CAF50";
        }
        statusCamera = statusCamera
      }
      if (id === "statusTemp") {
        if(state != undefined){
          document.getElementById('temperature').textContent = state;
        }
        else{
          if(!document.getElementById('temperature').textContent.includes('temperature*')){
            document.getElementById('temperature').textContent = '*' + document.getElementById('temperature').textContent
          }
        }
        return;
      }
      const lamp = document.getElementById(`lamp-${id}`);
      lamp.style.backgroundColor = state.trim() === "active" ? "#005e00" : "#990000";
    };

    function toggleCamera() {
      if (statusCamera.trim() === "inactive") {
        sendServerCommand("startCamera");  // Send command to stop camera

        statusCamera = "active";  // Toggle state to active

        setTimeout(() => {
          let imageElement = document.getElementById("webcamstream");
          imageElement.src = "/stream?action=stream&t=" + new Date().getTime();
        }, 2000);
      } else if (statusCamera.trim() === "active") {
        sendServerCommand("stopCamera");  // Send command to start camera

        statusCamera = "inactive";  // Toggle state to inactive
        let imageElement = document.getElementById("webcamstream");

        // Replace the webcam image with a message when deactivated
        imageElement.src = "";  // Stops the webcam feed
    }
  }

    const checkStatus = () => {
      ["statusRuntimeServer", "statusWebserver", "statusMoister", "statusCamera", "statusClients", "statusUptime", "statusTemp"].forEach(key => {
        fetch('/control', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ command: key })
        })
          .then(res => res.json())
          .then(json => {
            updateLamp(key, json.message);
          })
          .catch(err => {
            console.error(`Error fetching status for ${key}:`, err);
          });
      });
    };

    function sendServerCommand(command) {
      // Show a confirmation dialog before sending the request
      const userConfirmed = confirm(`Are you sure you want to trigger the execution of ${command}?\nThe services may be unavailable for a few minutes until the are restarted!`);

      if (userConfirmed) {
        fetch('/control', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ command: command }),
        })
          .then(response => response.json())
          .then(data => {
            console.log("fetching control ", data.message); // Handle response from Flask
          })
          .catch(error => {
            console.error('Error: ', error);
          });
      } else {
        console.log("Control cancelled by user.");
      }
    }

    function reloadLogs() {
      fetch('moist_log.csv')
        .then(response => {
          if (!response.ok) throw new Error("Failed to load log");
          return response.text();
        })
        .then(logText => {
          const pre = document.getElementById('pump-log');
          pre.textContent = logText;
          pre.scrollTop = pre.scrollHeight;
        })
        .catch(err => {
          console.error("Error loading logs:", err);
          document.getElementById('pump-log').textContent = "Error loading log file.";
        });
    }

    // Function to scroll the iframe content to the bottom
    function scrollToBottom(iframeId) {
      const iframe = document.getElementById(iframeId);
      try {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        iframeDoc.documentElement.scrollTop = iframeDoc.body.scrollHeight;
      } catch (e) {
        console.error('Unable to access iframe content:', e);
      }
    }

    // Initial load of logs
    reloadLogs();

    // Wait until the DOM is fully loaded before accessing elements
    document.addEventListener('DOMContentLoaded', function () {
      const waterButton = document.getElementById('water-button');
      const overrideCheckbox = document.getElementById('override-checkbox');
      const wateringFrame = document.getElementById('watering-frame');

      // Ensure that the elements exist
      if (!waterButton || !overrideCheckbox || !wateringFrame) {
        console.error("Error: One or more required elements are missing in the DOM.");
        return;
      }

      // Function to enable or disable the Water button based on the checkbox status
      function toggleWaterButton() {
        console.log('Override Checkbox Checked:', overrideCheckbox.checked);

        // If the checkbox is checked, enable the Water button; otherwise, disable it
        waterButton.disabled = !overrideCheckbox.checked;

        // If the checkbox is unchecked, disable the whole watering frame and gray it out
        if (overrideCheckbox.checked) {
          wateringFrame.style.pointerEvents = 'auto';  // Enable interactions
          wateringFrame.style.opacity = '1';  // Restore opacity
        } else {
          wateringFrame.style.pointerEvents = 'none';  // Disable interactions
          wateringFrame.style.opacity = '0.5';  // Apply gray out effect
        }
      }

      // Attach the toggle function to the checkbox event listener
      overrideCheckbox.addEventListener('click', toggleWaterButton);

      // Initialize button state on page load based on checkbox status
      toggleWaterButton(); // To handle initial state based on checkbox status
    });

    // Trigger the watering request after confirmation
    function triggerWater() {
      const waterLevel = document.getElementById('water-level').value; // Get the current slider value
      const pumpSelection = document.querySelector('input[name="pump"]:checked').value; // Get selected pump (pump0 or pump1)

      // Show a confirmation dialog before sending the request
      const userConfirmed = confirm(`Are you sure you want to water with Pump ${pumpSelection} at level ${waterLevel}?`);

      if (userConfirmed) {
        // Send the water level and pump selection to the Flask backend if confirmed
        console.log("stinging: ", JSON.stringify({
          water_duration: waterLevel,
          pump_selection: pumpSelection // Send pump selection as part of the request
        }))
        fetch('/water', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            water_duration: waterLevel,
            pump_selection: pumpSelection
          })
        })
          .then(async response => {
            const contentType = response.headers.get("content-type");
            if (!response.ok) {
              const errorText = await response.text();
              console.error("Server returned error:", errorText);
              throw new Error("Server error");
            }
            if (contentType && contentType.includes("application/json")) {
              return response.json();
            } else {
              throw new TypeError("Expected JSON, got: " + contentType);
            }
          })
          .then(data => {
            console.log('Water triggered: ', data);
          })
          .catch(error => {
            console.error('Water trigger error: ', error);
            alert("Failed to trigger watering.");
          });
      } else {
        console.log("Watering cancelled by user.");
      }
    }

    // Update the value of the slider as it's moved
    function updateWaterLevel(value) {
      document.getElementById('water-level-value').textContent = value;
    }


    // For setting data limit (chart buttons)
    function setDataLimit(limit) {
      // Your code for handling data limit
      console.log(`Data limit set to: ${limit}`);
    }

    async function fetchCSV() {
      try {
        const response = await fetch('moist_log.csv');
        const data = await response.text();
        const rows = data.split("\n");//.slice(1); // Skip header

        fullData.times = [];
        fullData.data0 = [];
        fullData.data1 = [];

        rows.forEach(row => {
          const [time, val0, val1] = row.split(",");
          if (time && val0 && val1) {
            fullData.times.push(time.trim());
            fullData.data0.push(parseInt(val0.trim(), 10));
            fullData.data1.push(parseInt(val1.trim(), 10));
          }
        });

        renderChartWithLimit();
      } catch (error) {
        console.error("Error fetching CSV:", error);
      }
    }

    function setDataLimit(limit) {
      currentLimit = limit;
      renderChartWithLimit();

      const buttons = document.querySelectorAll('.button-container button');
      buttons.forEach(btn => btn.classList.remove('active'));
    }

    function renderChartWithLimit() {
      let { times, data0, data1 } = fullData;

      if (!times.length) return;

      let startTime = times[0];
      let endTime = times[times.length - 1];
      let entryCount = times.length;

      times = times.slice(-currentLimit);
      data0 = data0.slice(-currentLimit);
      data1 = data1.slice(-currentLimit);

      updateChart(times, data0, data1);
// Calculate duration (based on full CSV data, not filtered)
const start = parseTimeToDate(fullData.times[0]);
const end = parseTimeToDate(fullData.times[fullData.times.length - 1]);
const diffMs = end - start;

let duration = "N/A";
if (!isNaN(diffMs)) {
  const totalMinutes = Math.floor(diffMs / (1000 * 60));
  const days = Math.floor(totalMinutes / (60 * 24));
  const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
  const minutes = totalMinutes % 60;

  duration = [
    days ? `${days}d` : "",
    hours ? `${hours}h` : "",
    `${minutes}m`
  ].filter(Boolean).join(" ");
}

// Calculate min and max values for both data0 and data1
const data0Min = Math.min(...fullData.data0);
const data0Max = Math.max(...fullData.data0);
const data1Min = Math.min(...fullData.data1);
const data1Max = Math.max(...fullData.data1);

const infoBox = document.getElementById('chart-info');
infoBox.innerHTML = `
  📅 <strong>Start:</strong> ${start.toLocaleTimeString()} &nbsp; |
  🧮 <strong>Entries:</strong> ${fullData.times.length} &nbsp; |
  ⏱️ <strong>Duration:</strong> ${duration} &nbsp;
  <br>
  📈 <strong>data0:</strong> min ${data0Min}, max ${data0Max} &nbsp; |
  📉 <strong>data1:</strong> min ${data1Min}, max ${data1Max}
`;

    }

    function parseTimeToDate(timeStr) {
      const [hours, minutes, seconds] = timeStr.split(":").map(num => parseInt(num, 10));
      const now = new Date();
      now.setHours(hours, minutes, seconds, 0); // Set to today's date with the given time
      return now;
    }

    function updateChart(times, data0, data1) {
      if (myChartInstance) {
        myChartInstance.data.labels = times;
        myChartInstance.data.datasets[0].data = data0;
        myChartInstance.data.datasets[1].data = data1;
        myChartInstance.update();
      } else {
        const ctx = document.getElementById('myChart').getContext('2d');
        myChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: times,
            datasets: [
              {
                label: 'Bottom',
                data: data0,
                borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accent-blue').trim(),
