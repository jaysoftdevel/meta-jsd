<!DOCTYPE HTML>
<html>
<head>
  <script type="text/javascript" src="https://cdn.canvasjs.com/canvasjs.stock.min.js"></script>
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
  <script type="text/javascript">
  window.onload = function () {
    var dataPoints1 = [], dataPoints2 = [];
    var chart;
    var fileInputElement = document.getElementById("csvInput");
    var summaryElement = document.getElementById("summary");

    // This function simulates fetching the CSV file every 10 seconds and reloading it
    function fetchAndUpdateCSV() {
      var file = fileInputElement.files[0];  // Assuming a file has been uploaded
      if (file) {
        // Parse the CSV file
        Papa.parse(file, {
          complete: function(results) {
            // Process the parsed CSV data
            processData(results.data);
          },
          header: false // We don't have headers in the CSV
        });
      }
    }

    // Fetch and update CSV every 10 seconds
    setInterval(fetchAndUpdateCSV, 10000); // 10000 milliseconds = 10 seconds

    // Function to process the CSV data
    function processData(data) {
      dataPoints1 = [];
      dataPoints2 = [];
      
      // Loop through each row in the CSV
      data.forEach(function(row) {
        var time = row[0];   // HH:MM:SS format
        var value1 = parseInt(row[1], 10);
        var value2 = parseInt(row[2], 10);

        // Convert HH:MM:SS into a JavaScript Date object
        var timeParts = time.split(":");
        var date = new Date();
        date.setHours(parseInt(timeParts[0], 10));
        date.setMinutes(parseInt(timeParts[1], 10));
        date.setSeconds(parseInt(timeParts[2], 10));
        
        // Add the data points to the respective series
        dataPoints1.push({x: date, y: value1});
        dataPoints2.push({x: date, y: value2});
      });

      // Set the initial viewport to show the last 20 data points
      var lastIndex = dataPoints1.length - 1;
      var initialViewportStart = Math.max(0, lastIndex - 19); // Last 20 points

      // Create or update the chart with the new data
      if (!chart) {
        // Create a new chart if it doesn't exist
        chart = new CanvasJS.StockChart("chartContainer", {
          theme: "light2",
          title: {
            text: "CSV Data with Time as X-Axis and Two Integer Values"
          },
          rangeChanged: function(e) {
            rangeChangedTriggered = true;
            updateSummary();
          },
          charts: [{
            axisX: {
              crosshair: {
                enabled: true,
                valueFormatString: "MMM DD, YYYY HH:mm:ss"
              },
              minimum: dataPoints1[initialViewportStart].x, // Set the start of the x-axis to the first of the last 20 points
              maximum: dataPoints1[lastIndex].x // Set the end of the x-axis to the last data point
            },
            axisY: {
              title: "Values",
              stripLines: [{
                showOnTop: true,
                lineDashType: "dash",
                color: "#ff4949",
                labelFontColor: "#ff4949",
                labelFontSize: 14
              }]
            },
            toolTip: {
              shared: true
            },
            data: [{
              type: "line",
              name: "Value 1",
              showInLegend: true,
              xValueFormatString: "MMM DD, YYYY HH:mm:ss",
              xValueType: "dateTime",
              dataPoints: dataPoints1,
              markerType: "circle", // This draws a dot for every data point
              markerSize: 5 // Size of the marker (dot)
            },{
              type: "line",
              name: "Value 2",
              showInLegend: true,
              xValueFormatString: "MMM DD, YYYY HH:mm:ss",
              xValueType: "dateTime",
              dataPoints: dataPoints2,
              markerType: "circle", // This draws a dot for every data point
              markerSize: 5 // Size of the marker (dot)
            }]
          }],
          navigator: {
            slider: {
              minimum: new Date(dataPoints1[initialViewportStart].x.getTime() - (90 * 1000))
            }
          },
          rangeSelector: {
            enabled: false
          }
        });
        chart.render();  // Initial render after chart creation
      } else {
        // If chart exists, just update the data points and re-render
        chart.options.charts[0].data[0].dataPoints = dataPoints1;
        chart.options.charts[0].data[1].dataPoints = dataPoints2;
        chart.options.charts[0].axisX.minimum = dataPoints1[initialViewportStart].x;
        chart.options.charts[0].axisX.maximum = dataPoints1[lastIndex].x;
        chart.render();
      }

      // Update the summary after processing the data
      updateSummary();
    }

    // Function to update the summary
    function updateSummary() {
      if (dataPoints1.length > 0) {
        var startTime = dataPoints1[0].x;
        var endTime = dataPoints1[dataPoints1.length - 1].x;
        var displayedStart = chart.options.charts[0].axisX.minimum;
        var displayedEnd = chart.options.charts[0].axisX.maximum;

        var numEntries = dataPoints1.length;
        var numEntriesInViewport = dataPoints1.filter(dp => dp.x >= displayedStart && dp.x <= displayedEnd).length;

        var totalTimeSpan = (endTime - startTime) / 1000; // Time span in seconds
        var displayedTimeSpan = (displayedEnd - displayedStart) / 1000; // Time span in seconds

        // Display the summary information
        summaryElement.innerHTML = `
          <strong>Start Time:</strong> ${startTime.toLocaleString()} 
          | <strong>Entries in Viewport:</strong> ${numEntriesInViewport} / ${numEntries}
          | <strong>Time Span in Viewport:</strong> ${formatTime(displayedTimeSpan)} / ${formatTime(totalTimeSpan)}
        `;
      }
    }

    // Helper function to format time in HH:MM:SS
    function formatTime(seconds) {
      var hours = Math.floor(seconds / 3600);
      var minutes = Math.floor((seconds % 3600) / 60);
      var sec = Math.floor(seconds % 60);
      return `${padZero(hours)}:${padZero(minutes)}:${padZero(sec)}`;
    }

    // Helper function to pad numbers to two digits
    function padZero(num) {
      return num < 10 ? '0' + num : num;
    }

    // For testing purposes: simulate an initial file input
    // This is just to initialize the CSV parsing. You can replace this part with actual user file input.
    document.getElementById("csvInput").addEventListener("change", function(event) {
      var file = event.target.files[0];
      if (file) {
        Papa.parse(file, {
          complete: function(results) {
            processData(results.data);
          },
          header: false // We don't have headers in the CSV
        });
      }
    });
  }
  </script>
  <style>
    /* Style for the chart container frame */
    #chartContainer {
      border: 2px solid #ccc;
      padding: 10px;
      margin-bottom: 20px;
    }

    /* Style for the summary */
    #summary {
      font-size: 16px;
      margin-top: 10px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <h2>Upload CSV File</h2>
  <input type="file" id="csvInput" accept=".csv">

  <div>
  <div id="chartContainer" style="align-items: center; height: 450px; width: 100%;"></div>

  <div id="summary" style="align-items: center;"></div>
</div>
</body>
</html>
